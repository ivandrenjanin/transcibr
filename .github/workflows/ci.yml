name: CI

# Nothing here but `just`. Every check CI performs a developer performs too,
# by running the same recipe -- a check that lives only in this file is one
# that lets someone break main while `just ci` still passes locally.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Windows)
    runs-on: windows-latest

    # Stated, never left to the platform's six-hour default. Nothing in the
    # justfile's own recipes carries a wall-clock ceiling of its own (issue
    # #152's ADR records this as an accepted risk), so this job timeout is the
    # only backstop for a hang -- the toolchain download, or any recipe below.
    # Generous against the minutes this job actually takes, so a slow runner
    # is never mistaken for one: the point is that a wedged job says so within
    # the hour instead of holding a runner until tea time tomorrow.
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install just
        uses: extractions/setup-just@v3

      # Pinned to a tagged release, never `latest`: an unpinned toolchain turns
      # an upstream change into a build failure on an unrelated commit, and
      # makes "it passed yesterday" unanswerable. Every pin is read out of the
      # justfile rather than copied here, so the release tag this installs
      # cannot drift from the one recorded in source -- but installing is all
      # this step does; no recipe below verifies the downloaded binaries'
      # version or hash (ADR-0035's "What did not move" section).
      - name: Install the pinned Odin release and odinfmt
        run: just install-tools

      # Everything a developer runs locally: fmt-check, check, build, release,
      # test, test-single, smoke, in that order. `just ci`'s own definition is
      # the one place that order is spelled out.
      - name: just ci
        run: just ci
